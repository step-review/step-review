name: QA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qa-main
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for component tests
        run: pnpm --filter @step-review/app exec playwright install --with-deps chromium
      - name: Check formatting
        run: pnpm check-formatting
      - name: Check linting
        run: pnpm lint
      - name: Check translations
        run: pnpm check-translations
      - name: Check types
        run: pnpm check-types
      - name: Test
        run: pnpm test
      - name: Build CLI
        run: pnpm --filter @step-review/cli build
