name: QA and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for component tests
        run: pnpm --filter @step-review/app exec playwright install --with-deps chromium
      - name: Check formatting
        run: pnpm check-formatting
      - name: Check linting
        run: pnpm lint
      - name: Check translations
        run: pnpm check-translations
      - name: Check types
        run: pnpm check-types
      - name: Test
        run: pnpm test
      - name: Build CLI
        run: pnpm --filter @step-review/cli build

  build-deploy:
    if: github.ref == 'refs/heads/main'
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: pnpm deploy-site --main
