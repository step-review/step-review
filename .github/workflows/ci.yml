name: CI

# Every pipeline runs QA. Pushes also publish the CLI: a beta from a branch, a
# release from a `vX.Y.Z` tag, which also deploys the app to production. Pull
# requests get a preview.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for component tests
        run: pnpm --filter @step-review/app exec playwright install --with-deps chromium
      - name: Set the release version
        if: github.event_name == 'push'
        run: pnpm release:ci
      - name: QA
        run: pnpm qa
      - name: Pack the CLI
        run: pnpm release:pack
      - name: Seal the release
        if: github.event_name == 'push'
        run: pnpm release:seal
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: release
          path: |
            packages/cli/.pack/
            packages/cli/.release/
          include-hidden-files: true
          retention-days: 30

  publish-packages:
    if: github.event_name == 'push' && github.repository == 'step-review/step-review'
    needs: qa
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      # npm trusted publishing: no token, and the package gets provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Releases check that the tag is on main.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: packages/cli
      # Publishes the sealed tarball; installs and builds nothing.
      - name: Publish
        run: node packages/tooling/release/src/publishRelease.ts

  deploy-production:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: qa
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Checking that the tag is on main needs the history.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the release tag
        run: node packages/tooling/release/src/checkReleaseTag.ts
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: APP_VERSION="${TAG#v}" pnpm build
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: pnpm deploy-site --production

  deploy-preview:
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    # Previews need the Cloudflare secrets, which fork PRs don't get.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: qa
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.number }}
        run: APP_VERSION="$(node -p "require('./package.json').version")-pr.$PULL_REQUEST_NUMBER" pnpm build
      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REVISION: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.number }}
        run: pnpm deploy-site --pr "$PULL_REQUEST_NUMBER"

  add-pr-comment:
    if: needs.deploy-preview.outputs.deployed == 'true'
    needs: deploy-preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview URL
        uses: actions/github-script@v8
        with:
          script: |
            const pullRequestNumber = context.payload.pull_request.number;
            const marker = "<!-- preview-deployments-comment -->";
            const body = [
              marker,
              "",
              "### Preview available",
              "",
              `https://pr-${pullRequestNumber}.step-review.dev/`,
              "",
              `Revision: ${context.payload.pull_request.head.sha}`,
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pullRequestNumber,
              per_page: 100,
            });
            const existingComment = comments.find(
              (comment) => comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker),
            );
            if (existingComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pullRequestNumber,
                body,
              });
            }
