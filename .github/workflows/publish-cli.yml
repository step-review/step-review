name: Publish CLI

on:
  push:
    tags: ["cli-v*"]

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: no token, and the package gets provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG" != "cli-v$version" ]; then
            echo "Tag $TAG doesn't match version $version in packages/cli/package.json." >&2
            exit 1
          fi
      - name: Check types
        run: pnpm --filter @step-review/cli --filter @step-review/review-format check-types
      - name: Test
        run: pnpm --filter @step-review/cli --filter @step-review/review-format test
      - name: Build
        run: pnpm --filter @step-review/cli build
      # pnpm pack drops the workspace protocol from the bundled dependencies;
      # npm publish then authenticates with the workflow's OIDC token.
      - name: Pack
        working-directory: packages/cli
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Publish
        run: npm publish "$RUNNER_TEMP"/step-review-cli-*.tgz --access public
