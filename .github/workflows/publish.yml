name: Publish packages

# Every push to a branch publishes a beta of the public packages, under a
# dist-tag named after the branch; a `vX.Y.Z` tag publishes X.Y.Z to `latest`.
on:
  push:
    branches: ["**"]
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for component tests
        run: pnpm --filter @step-review/app exec playwright install --with-deps chromium
      - name: Check formatting
        run: pnpm check-formatting
      - name: Check linting
        run: pnpm lint
      - name: Check translations
        run: pnpm check-translations
      - name: Check types
        run: pnpm check-types
      - name: Test
        run: pnpm test
      - name: Build CLI
        run: pnpm --filter @step-review/cli build

  publish:
    if: github.repository == 'step-review/step-review'
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: no token, and the packages get provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Releases check that the tag is on main.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish
        run: pnpm release:publish
