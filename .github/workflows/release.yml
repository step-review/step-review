name: Release

# A `vX.Y.Z` tag deploys the app to production. The CLI workflow publishes the
# CLI for the same tag.
on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for component tests
        run: pnpm --filter @step-review/app exec playwright install --with-deps chromium
      - name: Check formatting
        run: pnpm check-formatting
      - name: Check linting
        run: pnpm lint
      - name: Check translations
        run: pnpm check-translations
      - name: Check types
        run: pnpm check-types
      - name: Test
        run: pnpm test
      - name: Build CLI
        run: pnpm --filter @step-review/cli build

  deploy:
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Checking that the tag is on main needs the history.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the release tag
        run: node packages/tooling/release/src/checkReleaseTag.ts
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: APP_VERSION="${TAG#v}" pnpm build
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: pnpm deploy-site --production
