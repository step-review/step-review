name: Pull requests

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  qa:
    uses: ./.github/workflows/_qa.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read

  preview:
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      packages: ${{ steps.publish.outputs.packages }}
    # Previews need the Cloudflare secrets and the OIDC token, which fork PRs
    # don't get.
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # npm trusted publishing: no token, and the packages get provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.number }}
        run: APP_VERSION="$(node -p "require('./package.json').version")-pr.$PULL_REQUEST_NUMBER" pnpm build
      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REVISION: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.number }}
        run: pnpm deploy-site --pr "$PULL_REQUEST_NUMBER"
      - name: Publish packages
        id: publish
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.number }}
          PUBLISH_REVISION: ${{ github.event.pull_request.head.sha }}
        run: pnpm release:publish --pr "$PULL_REQUEST_NUMBER" --revision "$PUBLISH_REVISION"

  add-pr-comment:
    if: needs.preview.outputs.deployed == 'true'
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview URL and packages
        uses: actions/github-script@v8
        env:
          PREVIEW_PACKAGES: ${{ needs.preview.outputs.packages }}
        with:
          script: |
            const pullRequestNumber = context.payload.pull_request.number;
            const marker = "<!-- preview-deployments-comment -->";
            // Empty until the first release, which previews need.
            const previewPackages = JSON.parse(process.env.PREVIEW_PACKAGES);
            const body = [
              marker,
              "",
              "### Preview available",
              "",
              `https://pr-${pullRequestNumber}.step-review.dev/`,
              "",
              ...(previewPackages.length > 0
                ? [
                    "Preview packages:",
                    "",
                    ...previewPackages.map((previewPackage) => `- \`pnpx ${previewPackage}\``),
                    "",
                  ]
                : []),
              `Revision: ${context.payload.pull_request.head.sha}`,
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pullRequestNumber,
              per_page: 100,
            });
            const existingComment = comments.find(
              (comment) => comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker),
            );
            if (existingComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pullRequestNumber,
                body,
              });
            }
